<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOODLINE Rider – Deliveries</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--charcoal:#15191d;--charcoal-2:#1e2429;--steel:#2b3238;--steel-light:#4a545c;--amber:#e0342a;--yellow:#ffd93d;--gray:#8a9199;--soft:#c4cbd1;--white:#fff}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,sans-serif;background:var(--charcoal);color:var(--yellow);line-height:1.6;overflow-x:hidden}
button,input{font-family:inherit}button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 28px}
h1,h2,h3,h4,.logo{font-family:Oswald,sans-serif;font-weight:600;line-height:1.12;letter-spacing:.2px}
.tag{display:inline-flex;align-items:center;gap:10px;font:500 .85rem Oswald,sans-serif;color:var(--amber);margin-bottom:14px}
.tag:before{content:"";width:28px;height:3px;background:var(--amber)}
header{position:fixed;top:0;left:0;right:0;z-index:500;padding:20px 0;transition:padding .25s,background .25s,box-shadow .25s}
header.scrolled{padding:12px 0;background:var(--charcoal);box-shadow:0 6px 24px #0007}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{font-weight:700;font-size:1.5rem}.logo span{color:var(--amber)}
.logo small{font:500 1rem Inter,sans-serif;color:var(--gray);margin-left:10px}
.hero{position:relative;padding:140px 0 80px;background:linear-gradient(115deg,rgba(21,25,29,.94),rgba(21,25,29,.6)),radial-gradient(ellipse at 78% 30%,#33404a,#1c2227 55%,#14181c)}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 90px);pointer-events:none}
.hero .wrap{position:relative}
.hero h1{font-size:clamp(2.4rem,5vw,4rem);text-transform:uppercase;margin-bottom:18px;max-width:700px}
.hero h1 em{font-style:normal;color:var(--amber)}
.lead{color:var(--soft);max-width:520px;margin-bottom:30px}
section{scroll-margin-top:90px;padding:40px 0 20px;border-top:4px solid var(--amber);margin-bottom:24px}
section h2{font-size:2.1rem;text-transform:uppercase;margin-bottom:20px}
.marker{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.marker .idx{font:600 .85rem Oswald,sans-serif;color:var(--amber);letter-spacing:1px}
.marker .line{flex:1;height:1px;background:#ffffff29}
.marker .label{font:500 .75rem Oswald,sans-serif;color:var(--gray);text-transform:uppercase;letter-spacing:2.5px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed #ffffff29}

.live{font-size:.85rem;color:var(--soft)}.live:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#3ddc97;margin-right:8px}
header{background:var(--charcoal);box-shadow:0 6px 24px #0007}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 22px;font:600 .95rem Oswald,sans-serif;background:var(--amber);color:var(--charcoal);clip-path:polygon(0 0,100% 0,100% 70%,92% 100%,0 100%);transition:background .18s;margin-top:10px}.btn:hover{background:var(--white)}
.page{display:grid;grid-template-columns:1fr 380px;height:100vh;padding-top:70px}
#map{height:100%;background:var(--charcoal-2)}.nomap{padding:40px;color:var(--soft)}
.side{background:var(--charcoal-2);border-left:4px solid var(--amber);display:flex;flex-direction:column;min-height:0}
.side h3{padding:14px 18px;font-size:1.3rem;text-transform:uppercase;background:var(--steel)}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:12px 18px;font-size:.8rem;color:var(--soft)}
.legend i,.loc i{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px;background:#8a9199}
.legend .b,.loc.blue i{background:#3b82f6}.legend .g,.loc.green i{background:#22c55e}
#list{overflow:auto;flex:1;padding:0 18px 18px;display:grid;gap:10px;align-content:start}
.loc{border:1px solid #ffffff1f;border-left:5px solid #8a9199;padding:12px;background:var(--charcoal)}
.loc.blue{border-left-color:#3b82f6}.loc.green{border-left-color:#22c55e}
.lh{display:flex;align-items:center;cursor:pointer}.lh b{font:500 1rem Oswald,sans-serif;text-transform:uppercase}.lh span{margin-left:auto;color:var(--gray);font-size:.85rem}
@media(max-width:900px){.page{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}}
</style>
</head>
<body>
<header><div class="wrap"><div class="logo">FOOD<span>LINE</span><small>Rider</small></div><div class="live">Live deliveries</div></div></header>
<div class="page"><div id="map"></div>
<aside class="side"><h3>Delivery points</h3><div class="legend"><span><i></i>No delivery</span><span><i class="b" style="background:#3b82f6"></i>To deliver</span><span><i style="background:#22c55e"></i>Delivered</span></div><div id="list"></div></aside></div>
<script>
const DB="",MAPS_KEY="",KEY="foodline_orders",$=s=>document.querySelector(s),peso=n=>"₱"+n.toLocaleString();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LOC={Ligao:[13.2403,123.5353],Oas:[13.2578,123.4944],Polangui:[13.2958,123.4872],Guinobatan:[13.19,123.6083],"Camarines Norte":[14.1122,122.9553],"Camarines Sur":[13.65,123.4],Naga:[13.6218,123.1948],Sorsogon:[12.9742,124.0057],Pili:[13.5833,123.2833]};
const COL={grey:"#8a9199",blue:"#3b82f6",green:"#22c55e"};
const DARK=[{elementType:"geometry",stylers:[{color:"#1e2429"}]},{elementType:"labels.text.fill",stylers:[{color:"#c4cbd1"}]},{elementType:"labels.text.stroke",stylers:[{color:"#15191d"}]},{featureType:"water",elementType:"geometry",stylers:[{color:"#0f1316"}]},{featureType:"road",elementType:"geometry",stylers:[{color:"#2b3238"}]}];
let orders=[],map,mk={},iw;
async function load(){if(DB){try{const r=await(await fetch(DB+"/orders.json")).json();return r?Object.values(r):[]}catch(_){return orders}}try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(_){return[]}}
const ready=l=>orders.filter(o=>o.loc==l&&o.status=="READY");
function state(l){if(ready(l).length)return"blue";return orders.some(o=>o.loc==l&&o.status=="DELIVERED"&&Date.now()-(o.deliveredAt||0)<6e5)?"green":"grey"}
async function refresh(){orders=await load();drawPanel();drawMarkers()}
function drawPanel(){$("#list").innerHTML=Object.keys(LOC).map(l=>{const c=state(l),a=ready(l);
return `<div class="loc ${c}"><div class="lh" data-f="${l}"><i></i><b>${l}</b><span>${a.length?a.length+" to deliver":c=="green"?"Delivered":"No delivery"}</span></div>${a.map(o=>`<div class="row"><span>${esc(o.name)}</span><span>${peso(o.total)}</span></div>`).join("")}${a.length?`<button class="btn" data-l="${l}">Mark delivered (turn green)</button>`:""}</div>`}).join("")}
$("#list").onclick=e=>{const l=e.target.dataset.l,f=e.target.closest(".lh");if(l)deliver(l);else if(f&&map){map.panTo({lat:LOC[f.dataset.f][0],lng:LOC[f.dataset.f][1]});map.setZoom(11)}};
async function deliver(l){const a=ready(l),t=Date.now();a.forEach(o=>{o.status="DELIVERED";o.deliveredAt=t});
try{if(DB)await Promise.all(a.map(o=>fetch(DB+"/orders/"+o.id+".json",{method:"PATCH",body:JSON.stringify({status:"DELIVERED",deliveredAt:t})})));else{localStorage.setItem(KEY,JSON.stringify(orders));try{new BroadcastChannel(KEY).postMessage("upd")}catch(_){}}}catch(_){}refresh()}
const icon=(l,c)=>({url:"data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="120" height="52"><circle cx="60" cy="14" r="11" fill="${c}" stroke="#fff" stroke-width="3"/><text x="60" y="44" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" stroke="#15191d" stroke-width="3" paint-order="stroke">${l}</text></svg>`),scaledSize:new google.maps.Size(120,52),anchor:new google.maps.Point(60,14)});
function drawMarkers(){if(!map)return;for(const l in LOC){if(!mk[l]){mk[l]=new google.maps.Marker({map,title:l,position:{lat:LOC[l][0],lng:LOC[l][1]}});mk[l].addListener("click",()=>{iw.setContent(`<div style="color:#15191d"><b>${l}</b><br>${ready(l).length} to deliver</div>`);iw.open(map,mk[l])})}mk[l].setIcon(icon(l,COL[state(l)]))}}
window.initMap=()=>{map=new google.maps.Map($("#map"),{center:{lat:13.5,lng:123.4},zoom:8,styles:DARK,mapTypeControl:false,streetViewControl:false});iw=new google.maps.InfoWindow();const b=new google.maps.LatLngBounds();for(const l in LOC)b.extend({lat:LOC[l][0],lng:LOC[l][1]});map.fitBounds(b,60);drawMarkers()};
window.gm_authFailure=()=>{$("#map").innerHTML='<div class="nomap">Google Maps rejected the API key. Check the key and that Maps JavaScript API is enabled for this website address.</div>'};
if(MAPS_KEY){const s=document.createElement("script");s.src="https://maps.googleapis.com/maps/api/js?key="+MAPS_KEY+"&callback=initMap";s.async=true;document.head.append(s)}else $("#map").innerHTML='<div class="nomap">Add your Google Maps API key to MAPS_KEY at the top of this file to show the map.</div>';
addEventListener("storage",e=>{if(e.key==KEY)refresh()});try{new BroadcastChannel(KEY).onmessage=refresh}catch(_){}
setInterval(refresh,3000);refresh();
</script>
</body>
</html>
